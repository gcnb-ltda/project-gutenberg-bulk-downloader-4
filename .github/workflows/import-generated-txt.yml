name: Import Project Gutenberg TXT - Part 4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-generated-txt.yml'

permissions:
  contents: write

concurrency:
  group: gutenberg-txt-import-part-4
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import next TXT batch
        env:
          RUN_TARGET_MIB: '1000'
          REPO_TARGET_GIB: '8'
          MAX_TEXT_MIB: '90'
          PUSH_BATCH_MIB: '250'
          REQUEST_DELAY_SECONDS: '0.15'
        run: |
          chmod +x import_generated_txt.sh
          ./import_generated_txt.sh

      - name: Show TXT checkpoint
        if: always()
        run: |
          test -f txt-continuation-state.json && cat txt-continuation-state.json || true
